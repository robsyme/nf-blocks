import com.github.gradle.node.npm.task.NpmTask

plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.15'
    id 'com.github.node-gradle.node' version '7.1.0'
}

version = '0.1.0-beta.1'

nextflowPlugin {
    nextflowVersion = '26.04.6'

    provider = 'robsyme'
    description = 'Publishes pipeline outputs into a content-addressed store with their lineage, and reads them back in other pipelines with fromStore'
    className = 'robsyme.cas.CasPlugin'
    extensionPoints = [
        'robsyme.cas.lineage.CasLinStoreFactory',
        'robsyme.cas.nio.CasPathFactory',
        'robsyme.cas.trace.CasObserverFactory',
        'robsyme.cas.ext.CasExtension',
        'robsyme.cas.CasConfigScope',
    ]
}

// The explorer page (block explorer spec section 2): an npm project under web/,
// built on a pinned Node and packaged into the plugin jar. Its output is not committed.
node {
    download = true
    version = '24.21.0'
    nodeProjectDir = file('web')
    npmInstallCommand = 'ci'
}

tasks.register('webBuild', NpmTask) {
    description = 'Builds web/dist/index.html, the self-contained explorer page'
    group = 'build'
    dependsOn 'npmInstall'
    args = ['run', 'build']
    inputs.dir('web/src')
    inputs.file('web/build.mjs')
    inputs.file('web/schema-gen.mjs')
    inputs.file('web/package-lock.json')
    inputs.file('DESIGN.md')
    outputs.file('web/dist/index.html')
}

tasks.register('webTest', NpmTask) {
    description = 'Runs the page unit tests (node --test)'
    group = 'verification'
    dependsOn 'npmInstall'
    args = ['test']
    inputs.dir('web/src')
    inputs.dir('web/test')
    inputs.file('web/schema-gen.mjs')
    inputs.file('web/package-lock.json')
    inputs.file('DESIGN.md')
    inputs.file('src/main/groovy/robsyme/cas/core/Index.groovy')
    outputs.upToDateWhen { false }
}

processResources {
    dependsOn 'webBuild'
    from('web/dist/index.html') { into 'robsyme/cas/explorer' }
}

repositories {
    mavenCentral()
    // The only public source of io.nextflow:nf-lineage for stable releases.
    maven { url = 'https://s3-eu-west-1.amazonaws.com/maven.seqera.io/releases' }
}

dependencies {
    // Released Nextflow only. The nextflow-plugin Gradle plugin adds
    // io.nextflow:nextflow:<nextflowVersion> as compileOnly; nf-lineage is not transitive.
    compileOnly "io.nextflow:nf-lineage:${nextflowPlugin.nextflowVersion}"

    // Bundled at runtime (lands in the plugin zip lib/).
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'

    // Private S3 members for nf-blocks:explore (DESIGN.md §15). URL-connection
    // client only: the Apache and Netty clients would add megabytes for nothing.
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sso'
    implementation 'software.amazon.awssdk:ssooidc'
    implementation 'software.amazon.awssdk:url-connection-client'

    testImplementation "io.nextflow:nextflow:${nextflowPlugin.nextflowVersion}"
    testImplementation "io.nextflow:nf-lineage:${nextflowPlugin.nextflowVersion}"
    testImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
    testImplementation 'org.pf4j:pf4j:3.4.1'
}

configurations.configureEach {
    // 2.46.7 renamed the Apache client module to apache5-client; sso and
    // ssooidc still pull it in as their default sync client, so both names
    // are excluded to keep only url-connection-client on the classpath.
    exclude group: 'software.amazon.awssdk', module: 'apache-client'
    exclude group: 'software.amazon.awssdk', module: 'apache5-client'
    exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
}

configurations.runtimeClasspath {
    // The AWS SDK pulls in slf4j-api transitively, which would otherwise land
    // in the plugin zip's lib/ alongside it. Nextflow's own pf4j classloader
    // isolates each plugin, so a bundled slf4j-api with no logging provider
    // wins the plugin's own org.slf4j.LoggerFactory static binding lookup and
    // every @Slf4j log.* call silently falls back to the NOP logger. Excluding
    // it here leaves slf4j-api out of the runtime/zip lib/ entirely, so the
    // plugin's isolated classloader resolves org.slf4j from Nextflow's own
    // classpath instead, which carries the Logback binding. slf4j-api stays
    // available at compile time via Nextflow's compileOnly artifacts, so
    // @Slf4j-generated code still compiles.
    exclude group: 'org.slf4j'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { exceptionFormat = 'full'; events 'failed' }
}

// Ordinary unit tests: everything except the memory-bound test.
test {
    filter { excludeTestsMatching 'robsyme.cas.core.MemoryBoundTest' }
}

// The mechanised memory bound (DESIGN.md §0 rule 2): hash and store a 256 MiB
// file in a JVM whose whole heap is smaller than the file.
tasks.register('memoryBoundTest', Test) {
    description = 'Runs MemoryBoundTest under a 48 MiB heap'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    maxHeapSize = '48m'
    filter {
        includeTestsMatching 'robsyme.cas.core.MemoryBoundTest'
        failOnNoMatchingTests = false
    }
}

// DESIGN.md §0 rule 1: never build against an unreleased Nextflow.
tasks.register('dependencyCheck') {
    description = 'Fails if the build depends on a local Nextflow checkout or an absolute path'
    group = 'verification'
    doLast {
        def offenders = []
        // Assembled so this task's own source does not trip the check.
        def needles = ['include' + 'Build', 'files' + '(', '/Us' + 'ers/', '/ho' + 'me/']
        ['build.gradle', 'settings.gradle'].each { name ->
            def f = file(name)
            if( !f.exists() ) return
            f.readLines().eachWithIndex { line, i ->
                needles.each { needle ->
                    if( line.contains(needle) && !line.trim().startsWith('//') )
                        offenders << "${name}:${i+1}: ${line.trim()}"
                }
            }
        }
        // Block explorer spec section 1.4: the npm lockfiles fall under this check too.
        ['web', 'gate/browser'].each { String dir ->
            final def manifest = file("${dir}/package.json")
            final def lock = file("${dir}/package-lock.json")
            if( !manifest.exists() )
                return
            final def pkg = new groovy.json.JsonSlurper().parse(manifest) as Map
            ['dependencies', 'devDependencies'].each { String section ->
                ((pkg[section] ?: [:]) as Map).each { name, version ->
                    if( !(version ==~ /\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?/) )
                        offenders << "${dir}/package.json: ${name} is '${version}', not an exact released version"
                }
            }
            if( !lock.exists() ) {
                offenders << "${dir}/package-lock.json is missing"
                return
            }
            final def packages = ((new groovy.json.JsonSlurper().parse(lock) as Map).packages ?: [:]) as Map
            packages.each { path, entry ->
                final def resolved = (entry as Map).resolved as String
                if( path && !(entry as Map).link && !(resolved?.startsWith('https://registry.npmjs.org/')) )
                    offenders << "${dir}/package-lock.json: ${path} resolves from '${resolved}', not https://registry.npmjs.org/"
            }
        }
        if( offenders )
            throw new GradleException("Unreleased or machine-local dependency:\n  " + offenders.join('\n  '))
    }
}

check.dependsOn memoryBoundTest, dependencyCheck, webTest
